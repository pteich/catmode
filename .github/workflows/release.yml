name: Release

# Pushing a tag like v1.2.0 builds a universal CatMode.app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Info.plist
      - name: Test
        run: make test
      - name: Build
        run: make zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/CatMode.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "CatMode $GITHUB_REF_NAME" --generate-notes
